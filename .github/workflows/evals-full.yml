name: Evals (full sweep)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: >
          Model to evaluate. The pass threshold was measured against the model in evals/baseline_results.json. Any other model
          is exploratory, and a threshold failure then means "different", not "regressed".
        required: false
        default: openai/gpt-oss-120b

concurrency:
  group: evals-full
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Full eval sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EVAL_MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ENVIRONMENT: ci
      SLACK_CLIENT_ID: ci-placeholder
      SLACK_CLIENT_SECRET: ci-placeholder
      SLACK_SIGNING_SECRET: ci-placeholder
      SLACK_TOKEN_ENCRYPTION_KEY: ci-placeholder
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout/@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Verify the API key is present
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "::error::GROQ_API_KEY secret is not set."
            exit 1
          fi

      - name: Run full sweep
        run: pytest -m sweep evals/test_evals.py -s -v

      - name: Write job summary
        if : always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          files = sorted(Path("evals/results").glob("full-*.json"))
          if not files:
            print("## Full eval sweep\n\nNo results file was written (the run failed before scoring).")
            raise SystemExit

          d = json.loads(files[-1].read_text())
          print(f"## full eval sweep `{d['model']}`\n")
          print(f"**{d['passed']}/{d['total']} passed ({d['pass_rate']:.1%})**, "
                f"selection {d['selection_accuracy']:.1%}, "
                f"argument precision {d['argument_precision']:.1%}\n")
          print("| Category | Passed |\n|---|---|")
          for cat, s in d["by_category"].items():
            print(f"| {cat} | {s['passed']}/{s['total']} ({s['pass_rate']:.1%}) |")

          failures = [r for r in d["results"] if not r["passed"]]
          if failures:
              print("\n### Failures\n\n| Case | Reason |\n|---|---|")
              for r in failures:
                  reason = (r["failure_reason"] or "").replace("|", "\\|")
                  print(f"| `{r['case_id']}` | {reason} |")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-results-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 30