name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENVIRONMENT: ci
  GROQ_API_KEY: ci-placeholder
  SLACK_CLIENT_ID: ci-placeholder
  SLACK_CLIENT_SECRET: ci-placeholder
  SLACK_SIGNING_SECRET: ci-placeholder
  SLACK_TOKEN_ENCRYPTION_KEY: ci-placeholder
  DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Unit tests and eval tooling tests
        run: >
          pytest tests/ evals/test_scoring.py evals/test_benchmark_data.py
          -m "not smoke and not sweep"
          --cov=src --cov-report=term-missing --cov-report=xml
          -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14

  migrations:
    name: Migrations against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Check models and migrations agree
        run: alembic check

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Upgrade again
        run: alembic upgrade head