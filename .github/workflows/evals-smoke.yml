name: Evals (smoke)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: evals-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke eval (${{ vars.EVAL_MODEL_SMOKE || 'openai/gpt-oss-20b' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL_SMOKE || 'openai/gpt-oss-20b' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ENVIRONMENT: ci

      SLACK_CLIENT_ID: ci-placeholder
      SLACK_CLIENT_SECRET: ci-placeholder
      SLACK_SIGNING_SECRET: ci-placeholder
      SLACK_TOKEN_ENCRYPTION_KEY: ci-placeholder
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Verify the API key is present
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set."
            exit 1
          fi

      - name: Run smoke eval
        run: pytest -m smoke evals/test_evals.py -s -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14