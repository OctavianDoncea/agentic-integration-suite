name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: vars.RENDER_URL != ''
    steps:
      - name: Ping /health
        run: |
          curl -fsS \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            "${{ vars.RENDER_URL }}/health"